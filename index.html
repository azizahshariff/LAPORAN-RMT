<script>
  const sheetId = '1jkn6EwdZQRO3dodipb_RlWrMx5kjl579GIr7WeNS5M0';
  const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv`;

  async function loadSheetData() {
    try {
      const response = await fetch(csvUrl);
      const csvText = await response.text();
      const lines = csvText.split('\n');

      let tableRows = '';
      let totalRecords = 0;

      for (let i = 1; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
        const clean = (val) => val ? val.replace(/^"|"$/g, '').trim() : '-';

        // Pemetaan Indeks Tepat Berdasarkan Google Sheet Sebenar
        const tarikh = clean(cols[0]);
        const hari = clean(cols[1]);
        const masa = clean(cols[2]);
        const guru = clean(cols[3]);
        const menu = clean(cols[4]);
        const buah = clean(cols[5]);
        
        // Ambil data Tahun (Kolum M / Indeks 12) dan Pautan PDF (Kolum N / Indeks 13)
        const tahun = clean(cols[12]) || '2023';
        const pdfUrl = clean(cols[13]);
        const hasPdf = pdfUrl.startsWith('http');

        totalRecords++;

        tableRows += `
          <tr>
            <td style="text-align:center; font-weight:bold; color:#4a5568;">${totalRecords}</td>
            <td><span class="badge-tahun">${tahun}</span></td>
            <td><span class="badge-sesi">${hari}</span></td>
            <td>${tarikh}</td>
            <td>${masa}</td>
            <td><strong>${guru}</strong></td>
            <td>${menu}</td>
            <td>${buah}</td>
            <td style="text-align:center;">
              ${hasPdf ? `<a href="${pdfUrl}" target="_blank" class="btn-pdf">Buka PDF</a>` : '<span style="color:#e53e3e; font-size:9pt; font-weight:bold;">Belum Dijana</span>'}
            </td>
          </tr>
        `;
      }

      document.getElementById('tableBody').innerHTML = tableRows;
      document.getElementById('totalCount').textContent = totalRecords + ' Laporan';
    } catch (error) {
      document.getElementById('tableBody').innerHTML = `<tr><td colspan="9" style="text-align:center; color:red;">Ralat memuatkan data: ${error.message}</td></tr>`;
    }
  }

  function searchTable() {
    let input = document.getElementById("searchInput").value.toLowerCase();
    let rows = document.getElementById("tableBody").getElementsByTagName("tr");
    for (let i = 0; i < rows.length; i++) {
      rows[i].style.display = rows[i].textContent.toLowerCase().includes(input) ? "" : "none";
    }
  }

  loadSheetData();
</script>
